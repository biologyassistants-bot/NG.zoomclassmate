services:
  - type: web
    name: classmate
    # Docker runtime is required: the Dockerfile installs ffmpeg, which is
    # needed to compress/split recording audio before transcription.
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A persistent disk REQUIRES a paid plan. The free plan has NO disk, so all
    # data (passcode, students, imported recordings) is wiped on every redeploy.
    # 'starter' is the cheapest plan that supports a mounted disk.
    plan: starter
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Zoom Server-to-Server OAuth credentials (needed to fetch recording audio)
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      # Store all app data on the mounted disk below so it SURVIVES redeploys.
      # This is the key fix for data being wiped on every deploy.
      - key: DATA_DIR
        value: /var/data
    disk:
      name: classmate-data
      mountPath: /var/data
      sizeGB: 1
